<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>autenflo Admin</title>
<style>
:root{--p:#8a62d6;--pd:#5b3aa6;--b:#3b7fd4;--bg:#f1f0f7;--ink:#1d2433;--mut:#6b7385;--line:#dedbea;--ok:#1c7a5e;--bad:#b8453f}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.hide{display:none!important}h2{margin:0 0 16px;font-size:1.5rem}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,#ed:focus{outline:0;border-color:var(--p)}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:.9rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--b),var(--p));color:#fff;text-decoration:none}
.btn.g{background:#fff;color:var(--pd);border:1.5px solid var(--p)}.btn.r{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}.btn.s{padding:6px 12px;font-size:.85rem}.btn:disabled{opacity:.55;cursor:wait}
.hint{color:var(--mut);font-size:.82rem;margin-top:4px}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.acard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(70,60,130,.12)}
.acard h1{margin:0 0 4px;font-size:1.5rem}.acard h1 span{background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;color:transparent}
.warn{background:#fff4e0;border:1px solid #f0d199;color:#7a5200;border-radius:12px;padding:10px 14px;margin:14px 0;font-size:.88rem}
/* top bar */
.top{background:#1d1738;color:#fff;display:flex;align-items:center;gap:6px;padding:0 20px;height:56px;position:sticky;top:0;z-index:20}
.top .brand{font-weight:800;margin-right:18px}.top .brand span{background:linear-gradient(90deg,#9db8ff,#c9a8ff);-webkit-background-clip:text;color:transparent}
.top nav{display:flex;gap:4px;flex:1}.top nav button{background:none;border:0;color:#cfc8ea;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}.top nav button.on,.top nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.top .who{font-size:.85rem;color:#cfc8ea}.top .lo{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
main{padding:24px;max-width:1240px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}.card h3{margin:0 0 10px;font-size:.95rem}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}.hdr h2{margin:0}
.tabs{display:flex;gap:16px;margin:0 0 12px}.tabs button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent}.tabs button.on{color:var(--pd);border-color:var(--p)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#faf9fe;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
td img{width:64px;height:40px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:10px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#efe9fb;color:var(--pd);font-size:.78rem;font-weight:700}.tag.d{background:#fff1d6;color:#8a5a00}.tag.l{background:#ddf3ea;color:var(--ok)}
.acts{white-space:nowrap}.acts>*{margin-right:6px}
/* editor */
.eg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
#title{font-size:1.7rem;font-weight:700;padding:14px 16px}
.perma{display:flex;align-items:center;gap:6px;margin:10px 0 14px;color:var(--mut);font-size:.88rem}.perma input{padding:6px 10px;max-width:340px}
.tb{display:flex;flex-wrap:wrap;gap:5px;padding:8px;background:#fff;border:1.5px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;position:sticky;top:56px;z-index:5}
.tb button,.tb select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700;width:auto;min-width:34px}.tb button:hover{background:#f1ecfb}
#ed{min-height:520px;background:#fff;border:1.5px solid var(--line);border-radius:0 0 10px 10px;padding:22px 26px;font-size:1.05rem;line-height:1.75;overflow:auto}
#ed h2{font-size:1.6rem;margin:1.2em 0 .4em}#ed h3{font-size:1.25rem;margin:1.1em 0 .3em}#ed blockquote{border-left:4px solid var(--p);margin:1em 0;padding-left:16px;font-weight:600}#ed img{max-width:100%;border-radius:10px;cursor:pointer}#ed a{color:var(--pd)}
#ed:empty:before{content:"Yahan article likhiye...";color:#9aa0b3}
.wc{color:var(--mut);font-size:.82rem;margin-top:6px}
.lays{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lay input{position:absolute;opacity:0}.lay span{display:block;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;text-align:center;font-size:.78rem}.lay span svg{width:100%;height:auto;display:block}.lay span b{display:block;margin-top:3px}.lay input:checked+span{border-color:var(--p);background:#f6f2fe}.lay{position:relative}
.cprev{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#efeaf9;display:block;margin-bottom:8px}
.gp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-top:8px}.gp .t{color:#1a0dab;font-size:1.05rem;line-height:1.3}.gp .u{color:#1e6b3a;font-size:.8rem}.gp .d{color:#4d5156;font-size:.85rem}
.pubbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:12px}.chk input{width:auto}
dialog{border:0;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(420px,92vw)}dialog::backdrop{background:rgba(20,16,40,.5)}
#toast{position:fixed;right:18px;bottom:18px;background:#1d2433;color:#fff;padding:12px 18px;border-radius:12px;max-width:380px;display:none;z-index:99}#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.empty{padding:34px;text-align:center;color:var(--mut)}
@media(max-width:960px){.eg{grid-template-columns:1fr}main{padding:14px}.top{padding:0 10px;overflow-x:auto}.top .who{display:none}.tb{top:56px}table{display:block;overflow-x:auto}}
</style>
</head>
<body>

<div id="auth" class="hide"><div class="acard">
  <h1>autenflo <span>Admin</span></h1><p class="hint" id="aSub"></p>
  <div id="aMissing" class="warn hide"></div>
  <form id="aForm" autocomplete="on">
    <label>Username</label><input id="a-user" autocomplete="username" required>
    <label>Password</label><input id="a-pass" type="password" autocomplete="current-password" required>
    <div id="setupExtra" class="hide"><label>Password dobara</label><input id="a-pass2" type="password" autocomplete="new-password"><label>Setup key</label><input id="a-key" type="password" placeholder="Netlify me jo SETUP_KEY rakhi hai"><div class="hint">Ye key sirf pehla account banane ke liye chahiye.</div></div>
    <p><button class="btn" id="aBtn" style="width:100%"></button></p>
  </form>
</div></div>

<div id="app" class="hide">
  <div class="top"><div class="brand">autenflo <span>Admin</span></div>
    <nav><button data-v="posts" class="on">Posts</button><button data-v="new">+ Add New</button><button data-v="users">Users</button></nav>
    <span class="who" id="who"></span><button class="lo" id="logout">Logout</button></div>
  <main>
    <section id="v-posts">
      <div class="hdr"><h2>Posts</h2><button class="btn" id="addBtn">+ Add New</button><input id="q" placeholder="Search..." style="max-width:240px"></div>
      <div class="tabs" id="tabs"><button data-f="all" class="on">All <span></span></button><button data-f="live">Published <span></span></button><button data-f="draft">Drafts <span></span></button></div>
      <div id="tbl"></div>
    </section>

    <section id="v-edit" class="hide">
      <div class="eg">
        <div>
          <input id="title" placeholder="Post ka title yahan likhiye">
          <div class="perma"><span>/blog/</span><input id="slug" placeholder="slug"><span>.html</span></div>
          <div class="tb" id="tb">
            <select id="blk"><option value="p">Paragraph</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="h4">Heading 4</option></select>
            <button data-c="bold" title="Bold"><b>B</b></button><button data-c="italic" title="Italic"><i>I</i></button><button data-c="underline" title="Underline"><u>U</u></button>
            <button data-c="insertUnorderedList">• List</button><button data-c="insertOrderedList">1. List</button><button data-c="blockquote">❝</button><button data-c="insertHorizontalRule">―</button>
            <button data-c="link">🔗 Link</button><button data-c="unlink">Unlink</button><button data-c="image">🖼 Image</button>
            <button data-c="removeFormat">Clear</button><button data-c="undo">↶</button><button data-c="redo">↷</button>
          </div>
          <div id="ed" contenteditable="true" spellcheck="true"></div>
          <div class="wc" id="wc"></div>
          <input type="file" id="imgFile" accept="image/*" class="hide"><input type="file" id="covFile" accept="image/*" class="hide">
        </div>
        <aside>
          <div class="card"><h3>Publish</h3>
            <div class="hint" id="stat"></div>
            <label>Date</label><input id="date" type="date">
            <div class="pubbar"><button class="btn g" id="draftBtn">Save Draft</button><button class="btn g" id="prevBtn">Preview</button><button class="btn" id="pubBtn">Publish</button></div>
            <div class="pubbar"><button class="btn r s hide" id="delBtn">Delete post</button></div>
          </div>
          <div class="card"><h3>Page design (layout)</h3><div class="lays" id="lays"></div></div>
          <div class="card"><h3>Details</h3>
            <label style="margin-top:0">Category</label><select id="cat"><option>AI</option><option>Marketing</option><option>Sales</option><option>Finance</option><option>Business Tips</option></select>
            <label>Author</label><input id="author" value="autenflo">
            <label class="chk"><input type="checkbox" id="cta" checked> Neeche WhatsApp box dikhayein</label>
          </div>
          <div class="card"><h3>Cover image</h3>
            <img class="cprev hide" id="cprev" alt="">
            <button class="btn g s" id="covBtn">Image chuniye</button> <button class="btn r s hide" id="covRm">Hatayein</button>
            <label>Image ka alt text</label><input id="covAlt" placeholder="Image me kya hai">
            <div class="hint">Khaali chhodoge to category ka illustration dikhega.</div>
          </div>
          <div class="card"><h3>SEO</h3>
            <label style="margin-top:0">SEO title (optional)</label><input id="seot" placeholder="Khaali = title | autenflo">
            <label>Meta description <span class="hint" id="cnt"></span></label><textarea id="desc" rows="3"></textarea>
            <div class="gp"><div class="t" id="gt"></div><div class="u" id="gu"></div><div class="d" id="gd"></div></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="v-users" class="hide">
      <h2>Users</h2>
      <div id="utbl"></div>
      <div class="card" style="max-width:460px;margin-top:16px"><h3>Naya user jodiye</h3>
        <label style="margin-top:0">Username</label><input id="nu-u" autocomplete="off"><label>Password (8+ characters)</label><input id="nu-p" type="password" autocomplete="new-password"><p><button class="btn" id="nuBtn">User banayein</button></p></div>
      <div class="card" style="max-width:460px"><h3>Apna password badlein</h3>
        <label style="margin-top:0">Purana password</label><input id="pw-o" type="password" autocomplete="current-password"><label>Naya password</label><input id="pw-n" type="password" autocomplete="new-password"><p><button class="btn g" id="pwBtn">Badlein</button></p></div>
    </section>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="lf"><h3 style="margin-top:0">Link jodiye</h3>
  <label>Text</label><input id="l-text"><label>URL</label><input id="l-url" placeholder="https://..." required>
  <label class="chk"><input type="checkbox" id="l-blank" checked> Naye tab me kholein</label>
  <p style="text-align:right;margin-bottom:0"><button type="button" class="btn g" id="l-cancel">Cancel</button> <button class="btn" id="l-ok">Link lagayein</button></p></form></dialog>
<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var esc=function(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var tok=localStorage.getItem('aut_tok')||'',me='',S={slug:'',isLive:false,draftKey:null,cover:'',layout:'classic',slugManual:false},LIVE=[],DR=[],filt='all';
var SITE=location.origin;
function toast(m,k){var t=$('toast');t.textContent=m;t.className=k||'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},k==='bad'?7000:3800)}
async function api(action,data){
  var r=await fetch('/api/admin',{method:'POST',headers:Object.assign({'content-type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),body:JSON.stringify(Object.assign({action:action},data||{}))});
  var j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&tok&&action!=='login'&&action!=='me'){logout(true);throw new Error('Session khatam. Dobara login kijiye.')}
  if(!r.ok)throw new Error(j.error||('Server error '+r.status+'. Netlify function check kijiye.'));return j}
function logout(silent){tok='';localStorage.removeItem('aut_tok');$('app').classList.add('hide');initAuth();if(silent!==true)toast('Logout ho gaye.')}

/* ---------- auth ---------- */
async function initAuth(){
  $('auth').classList.remove('hide');$('aBtn').disabled=true;
  try{var s=await api('status');var setup=s.setup;
    $('aSub').textContent=setup?'Pehla admin account banaiye.':'Login kijiye.';$('aBtn').textContent=setup?'Account banayein':'Login';
    $('setupExtra').classList.toggle('hide',!setup);$('a-pass').autocomplete=setup?'new-password':'current-password';$('aForm').dataset.mode=setup?'setup':'login';
    if(s.missing.length){$('aMissing').classList.remove('hide');$('aMissing').textContent='Netlify me ye Environment variables baaki hain: '+s.missing.join(', ')}else $('aMissing').classList.add('hide');
  }catch(e){$('aSub').textContent='';$('aMissing').classList.remove('hide');$('aMissing').textContent='Server se baat nahi ho paayi. Pakka kijiye ki netlify/functions/admin.mjs deploy hui hai. ('+e.message+')'}
  $('aBtn').disabled=false}
$('aForm').addEventListener('submit',async function(e){e.preventDefault();var mode=this.dataset.mode,u=$('a-user').value.trim(),p=$('a-pass').value;$('aBtn').disabled=true;
  try{if(mode==='setup'){if(p!==$('a-pass2').value)throw new Error('Dono password match nahi karte.');var r=await api('setup',{username:u,password:p,key:$('a-key').value})}else var r=await api('login',{username:u,password:p});
    tok=r.token;me=r.user;localStorage.setItem('aut_tok',tok);$('auth').classList.add('hide');$('a-pass').value='';startApp()}catch(err){toast(err.message,'bad')}$('aBtn').disabled=false});

async function boot(){if(tok){try{var r=await api('me');me=r.user;startApp();return}catch(e){tok=''}}initAuth()}
function startApp(){$('app').classList.remove('hide');$('who').textContent='👤 '+me;go('posts');loadList()}

/* ---------- views ---------- */
function go(v){['posts','edit','users'].forEach(function(x){$('v-'+x).classList.toggle('hide',x!==(v==='new'?'edit':v))});
  document.querySelectorAll('.top nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='new')openEditor(null);if(v==='users')loadUsers();window.scrollTo(0,0)}
document.querySelectorAll('.top nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
$('addBtn').onclick=function(){go('new')};$('logout').onclick=function(){logout()};

function dl(d){var x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
async function loadList(){try{var r=await api('list');LIVE=r.posts;DR=r.drafts;renderList()}catch(e){toast(e.message,'bad');$('tbl').innerHTML='<div class="card empty">Posts load nahi hue.</div>'}}
function renderList(){
  var q=$('q').value.toLowerCase(),rows=[];
  var fx=function(p){return !q||(p.title||'').toLowerCase().indexOf(q)>-1};
  var th=function(p){return p.cover?'<img src="'+esc(p.cover)+'" alt="">':''};
  if(filt!=='draft')LIVE.filter(fx).forEach(function(p){rows.push('<tr><td>'+th(p)+'<b>'+esc(p.title)+'</b><div class="hint">/blog/'+esc(p.slug)+'.html</div></td><td><span class="tag">'+esc(p.cat)+'</span></td><td>'+dl(p.date)+'</td><td><span class="tag l">Published</span></td><td class="acts"><button class="btn g s" data-e="'+esc(p.slug)+'">Edit</button><a class="btn g s" target="_blank" href="/blog/'+esc(p.slug)+'.html">View</a></td></tr>')});
  if(filt!=='live')DR.filter(fx).forEach(function(p){rows.push('<tr><td>'+th(p)+'<b>'+esc(p.title||'(bina title)')+'</b><div class="hint">Draft</div></td><td><span class="tag d">'+esc(p.cat||'-')+'</span></td><td>'+(p.date?dl(p.date):'-')+'</td><td><span class="tag d">Draft</span></td><td class="acts"><button class="btn g s" data-ed="'+esc(p.slug)+'">Edit</button><button class="btn r s" data-xd="'+esc(p.slug)+'">Delete</button></td></tr>')});
  var sp=document.querySelectorAll('#tabs span');sp[0].textContent='('+(LIVE.length+DR.length)+')';sp[1].textContent='('+LIVE.length+')';sp[2].textContent='('+DR.length+')';
  $('tbl').innerHTML=rows.length?'<table><tr><th>Post</th><th>Category</th><th>Date</th><th>Status</th><th></th></tr>'+rows.join('')+'</table>':'<div class="card empty">Koi post nahi mila. "Add New" dabaiye.</div>'}
$('q').addEventListener('input',renderList);
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filt=b.dataset.f;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});renderList()});
$('tbl').addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;
  try{if(b.dataset.e){var r=await api('get',{slug:b.dataset.e,kind:'post'});openEditor(r.post,'live')}
  else if(b.dataset.ed){var r=await api('get',{slug:b.dataset.ed,kind:'draft'});openEditor(r.post,'draft')}
  else if(b.dataset.xd){if(confirm('Ye draft hata dein?')){await api('deldraft',{slug:b.dataset.xd});toast('Draft hata diya.','ok');loadList()}}}catch(err){toast(err.message,'bad')}});

/* ---------- editor ---------- */
var LAYS=[['classic','Classic','Text left, image right','<rect x="4" y="8" width="34" height="5" rx="2" fill="#8a62d6"/><rect x="4" y="18" width="30" height="3" rx="1.5" fill="#cfc8ea"/><rect x="4" y="24" width="30" height="3" rx="1.5" fill="#cfc8ea"/><rect x="46" y="6" width="40" height="26" rx="4" fill="#3b7fd4"/><rect x="8" y="40" width="74" height="3" rx="1.5" fill="#cfc8ea"/><rect x="8" y="47" width="60" height="3" rx="1.5" fill="#cfc8ea"/>'],
['cover','Cover','Wide image on top','<rect x="4" y="4" width="82" height="24" rx="4" fill="#3b7fd4"/><rect x="22" y="33" width="46" height="5" rx="2" fill="#8a62d6"/><rect x="8" y="43" width="74" height="3" rx="1.5" fill="#cfc8ea"/><rect x="8" y="49" width="60" height="3" rx="1.5" fill="#cfc8ea"/>'],
['magazine','Magazine','Big title, wide image','<rect x="6" y="5" width="60" height="8" rx="2" fill="#8a62d6"/><rect x="4" y="17" width="82" height="20" rx="4" fill="#3b7fd4"/><rect x="6" y="41" width="78" height="6" rx="2" fill="#efe9fb"/><rect x="8" y="51" width="70" height="3" rx="1.5" fill="#cfc8ea"/>'],
['minimal','Minimal','Sirf text, no image','<rect x="20" y="8" width="50" height="6" rx="2" fill="#8a62d6"/><rect x="26" y="19" width="38" height="3" rx="1.5" fill="#cfc8ea"/><rect x="10" y="30" width="70" height="3" rx="1.5" fill="#cfc8ea"/><rect x="10" y="37" width="70" height="3" rx="1.5" fill="#cfc8ea"/><rect x="10" y="44" width="56" height="3" rx="1.5" fill="#cfc8ea"/>']];
$('lays').innerHTML=LAYS.map(function(l){return'<label class="lay"><input type="radio" name="lay" value="'+l[0]+'"><span><svg viewBox="0 0 90 58"><rect width="90" height="58" rx="6" fill="#fff"/>'+l[3]+'</svg><b>'+l[1]+'</b>'+l[2]+'</span></label>'}).join('');
function setLayout(v){S.layout=v;document.querySelectorAll('input[name=lay]').forEach(function(r){r.checked=r.value===v})}
document.querySelectorAll('input[name=lay]').forEach(function(r){r.onchange=function(){S.layout=r.value}});
function slugify(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)}
function today(){return new Date().toISOString().slice(0,10)}
function openEditor(p,kind){
  p=p||{};S.isLive=kind==='live';S.draftKey=kind==='draft'?p.slug:null;S.slugManual=!!(p.slug&&!/^draft-/.test(p.slug));
  $('title').value=p.title||'';$('slug').value=/^draft-/.test(p.slug||'')?'':(p.slug||'');$('slug').disabled=S.isLive;$('ed').innerHTML=p.html||'';$('date').value=p.date||today();
  $('cat').value=p.cat||'AI';$('author').value=p.author||'autenflo';$('cta').checked=p.cta!==false;$('desc').value=p.desc||'';$('seot').value=p.seoTitle||'';$('covAlt').value=p.coverAlt||'';
  setCover(p.cover||'');setLayout(p.layout||'classic');$('delBtn').classList.toggle('hide',!S.isLive);$('pubBtn').textContent=S.isLive?'Update':'Publish';
  $('stat').textContent=S.isLive?'Status: Published':kind==='draft'?'Status: Draft':'Status: Naya post';upd();
  $('v-posts').classList.add('hide');$('v-users').classList.add('hide');$('v-edit').classList.remove('hide');
  document.querySelectorAll('.top nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===(S.isLive||kind==='draft'?'posts':'new'))});window.scrollTo(0,0)}
function setCover(c){S.cover=c;$('cprev').classList.toggle('hide',!c);if(c)$('cprev').src=c;$('covRm').classList.toggle('hide',!c)}
function upd(){
  var n=$('desc').value.length;$('cnt').textContent=n+' / 155';$('cnt').style.color=n>155?'#b8453f':'';
  var t=$('seot').value||(($('title').value||'Post title')+' | autenflo');$('gt').textContent=t;$('gu').textContent='autenflo.com › blog › '+($('slug').value||'slug');$('gd').textContent=$('desc').value||'Meta description yahan dikhega.';
  var w=($('ed').textContent.trim().match(/\S+/g)||[]).length;$('wc').textContent=w+' words'}
['desc','seot','slug','title'].forEach(function(i){$(i).addEventListener('input',upd)});$('ed').addEventListener('input',upd);
$('title').addEventListener('input',function(){if(!S.isLive&&!S.slugManual)$('slug').value=slugify(this.value);upd()});$('slug').addEventListener('input',function(){S.slugManual=true});
$('ed').addEventListener('paste',function(e){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
$('ed').addEventListener('click',function(e){if(e.target.tagName==='IMG'){var a=prompt('Is image ka alt text (SEO ke liye):',e.target.getAttribute('alt')||'');if(a!==null)e.target.setAttribute('alt',a)}});

var rng=null;function saveSel(){var s=getSelection();if(s.rangeCount&&$('ed').contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange()}
function restSel(){$('ed').focus();if(rng){var s=getSelection();s.removeAllRanges();s.addRange(rng)}}
function resize(file,max,cb){var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(max,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',.85))};im.src=rd.result};rd.readAsDataURL(file)}
$('tb').addEventListener('mousedown',function(e){if(e.target.closest('button'))e.preventDefault()});
$('tb').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var c=b.dataset.c;$('ed').focus();
  if(c==='link'){saveSel();$('l-text').value=rng?rng.toString():'';$('l-url').value='';$('dlg').showModal()}
  else if(c==='image'){saveSel();$('imgFile').click()}
  else if(c==='blockquote')document.execCommand('formatBlock',false,'<blockquote>');
  else document.execCommand(c,false,null);upd()});
$('blk').addEventListener('change',function(){$('ed').focus();document.execCommand('formatBlock',false,'<'+this.value+'>');this.value='p';upd()});
$('l-cancel').onclick=function(){$('dlg').close()};
$('lf').addEventListener('submit',function(e){e.preventDefault();var url=$('l-url').value.trim(),txt=$('l-text').value.trim()||url;if(!/^(https?:\/\/|\/|#|mailto:|tel:)/i.test(url)){toast('URL https:// se shuru hona chahiye.','bad');return}
  $('dlg').close();restSel();document.execCommand('insertHTML',false,'<a href="'+esc(url)+'"'+($('l-blank').checked?' target="_blank" rel="noopener"':'')+'>'+esc(txt)+'</a>&nbsp;');upd()});
$('imgFile').addEventListener('change',function(){var f=this.files[0];this.value='';if(!f)return;resize(f,1200,function(d){restSel();document.execCommand('insertImage',false,d);toast('Image jud gayi. Alt text ke liye image par click kijiye.','ok');upd()})});
$('covBtn').onclick=function(){$('covFile').click()};$('covFile').addEventListener('change',function(){var f=this.files[0];this.value='';if(f)resize(f,1400,setCover)});$('covRm').onclick=function(){setCover('')};

function read(){return{slug:$('slug').value.trim(),title:$('title').value.trim(),desc:$('desc').value.trim(),cat:$('cat').value,date:$('date').value,html:$('ed').innerHTML,cover:S.cover,coverAlt:$('covAlt').value.trim(),layout:S.layout,cta:$('cta').checked,author:$('author').value.trim()||'autenflo',seoTitle:$('seot').value.trim()}}
function busy(on){['pubBtn','draftBtn','prevBtn','delBtn'].forEach(function(i){$(i).disabled=on})}
$('draftBtn').onclick=async function(){var p=read();if(!p.title){toast('Pehle title likhiye.','bad');return}busy(true);
  try{if(S.draftKey&&p.slug!==S.draftKey&&p.slug){await api('deldraft',{slug:S.draftKey})}if(!p.slug&&S.draftKey)p.slug=S.draftKey;var r=await api('savedraft',{post:p});S.draftKey=r.slug;toast('Draft save ho gaya.','ok');loadList()}catch(e){toast(e.message,'bad')}busy(false)};
$('prevBtn').onclick=async function(){var w=window.open('','_blank');busy(true);try{var r=await api('preview',{post:read()});w.document.open();w.document.write(r.html);w.document.close()}catch(e){if(w)w.close();toast(e.message,'bad')}busy(false)};
$('pubBtn').onclick=async function(){
  var p=read();if(!p.title||!p.slug||!p.desc||!p.html.replace(/<[^>]*>/g,'').trim()){toast('Title, slug, meta description aur article, sab bharna zaroori hai.','bad');return}
  if(!/^[a-z0-9-]+$/.test(p.slug)){toast('Slug me sirf a-z, 0-9 aur - chalega.','bad');return}
  var imgs=[],n=0,stamp=Date.now();
  p.html=p.html.replace(/src="data:image\/[a-z+]+;base64,([^"]+)"/g,function(m,b64){var name=stamp+'-'+(++n)+'.jpg';imgs.push({path:'blog/images/'+name,b64:b64});return'src="/blog/images/'+name+'"'});
  if(p.cover.indexOf('data:')===0){var cn=stamp+'-cover.jpg';imgs.push({path:'blog/images/'+cn,b64:p.cover.split(',')[1]});p.cover='/blog/images/'+cn}
  busy(true);$('pubBtn').textContent='Publish ho raha hai...';
  try{var r=await api('publish',{post:p,images:imgs,isNew:!S.isLive,draftKey:S.draftKey});toast('Publish ho gaya! Site 1-2 minute me update hogi.','ok');go('posts');loadList()}
  catch(e){toast(e.message,'bad')}$('pubBtn').textContent=S.isLive?'Update':'Publish';busy(false)};
$('delBtn').onclick=async function(){var s=$('slug').value;if(!confirm('"'+s+'" ko site se hata dein?'))return;busy(true);try{await api('delete',{slug:s});toast('Post hata diya gaya.','ok');go('posts');loadList()}catch(e){toast(e.message,'bad')}busy(false)};

/* ---------- users ---------- */
async function loadUsers(){try{var r=await api('users');$('utbl').innerHTML='<table><tr><th>Username</th><th>Banaya gaya</th><th></th></tr>'+r.users.map(function(u){return'<tr><td><b>'+esc(u.u)+'</b>'+(u.u===me?' <span class="tag">Aap</span>':'')+'</td><td>'+(u.created?dl(u.created.slice(0,10)):'-')+'</td><td>'+(u.u===me?'':'<button class="btn r s" data-du="'+esc(u.u)+'">Delete</button>')+'</td></tr>'}).join('')+'</table>'}catch(e){toast(e.message,'bad')}}
$('utbl').addEventListener('click',async function(e){var b=e.target.closest('button');if(!b||!confirm('Ye user hata dein?'))return;try{await api('deluser',{username:b.dataset.du});loadUsers()}catch(err){toast(err.message,'bad')}});
$('nuBtn').onclick=async function(){try{await api('adduser',{username:$('nu-u').value.trim(),password:$('nu-p').value});$('nu-u').value=$('nu-p').value='';toast('User ban gaya.','ok');loadUsers()}catch(e){toast(e.message,'bad')}};
$('pwBtn').onclick=async function(){try{await api('passwd',{old:$('pw-o').value,password:$('pw-n').value});$('pw-o').value=$('pw-n').value='';toast('Password badal gaya.','ok')}catch(e){toast(e.message,'bad')}};
boot();
</script>
</body>
</html>
